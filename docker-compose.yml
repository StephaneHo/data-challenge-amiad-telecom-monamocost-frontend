services:

  # -------------------------------------------------------------------
  # PostgreSQL + pgvector
  # -------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: postgres-rag
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: am-rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d am-rag"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - am-net

  # -------------------------------------------------------------------
  # Backend FastAPI + pipeline RAG
  # -------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: am-backend
    restart: unless-stopped
    env_file: backend/.env
    environment:
      # Override les paths OCR Windows en valeurs Linux/Docker valides
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/am-rag
      TESSERACT_CMD: ""
      TESSDATA_DIR: ""
      POPPLER_PATH: ""
      OCR_LANG: fra
    volumes:
      # Monte le corpus + données en read-only pour ingestion et runs
      - ./Experimental:/app/../Experimental:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - am-net

volumes:
  postgres_data:

networks:
  am-net:
    driver: bridge
